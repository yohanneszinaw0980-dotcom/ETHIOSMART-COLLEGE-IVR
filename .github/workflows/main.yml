[app]

# (str) Title of your application
title = EthioSmart College IVR

# (str) Package name
package.name = ethiosmartcollegeivr

# (str) Package domain (needed for android packaging)
package.domain = org.ethiosmart

# (list) Source files to include (let it empty to include all files)
source.include_exts = py,png,jpg,kv,atlas

# (list) List of directory to include/exclude from source files
source.include_dirs = 

# (list) Application requirements
# add python and kivy or other libraries your app needs
requirements = python3,kivy

# (str) Supported orientations
orientation = portrait

# (list) List of permissions
android.permissions = INTERNET

# (int) Target Android API, should be as high as possible.
android.sdk_version = 33

# (str) Android NDK version to use
android.ndk_version = 25b

# (int) Minimum API your APK / AAB will support
android.min_api = 21

# (bool) Use AndroidX for Android support library
android.androidx = True

[buildozer]

# (int) Log level (0 = error only, 1 = info, 2 = debug (with command output))
log_level = 2

# (int) Display warning if buildozer is run as root (0 = False, 1 = D Angers, 2 = True)
warn_on_root = 1
