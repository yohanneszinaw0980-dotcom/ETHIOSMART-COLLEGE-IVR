name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            ant

    - name: Install Python Packages
      run: |
        pip install --upgrade pip
        pip install --upgrade buildozer cython==0.29.36

    - name: Force Install Android SDK and Build-Tools (Fixes Aidl Error)
      env:
        REPO_OS_OVERRIDE: "linux"
      run: |
        ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
        
        # የ Android commandline-tools በቀጥታ ከጎግል ማውረድ እና ማዋቀር
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d temp_tools
        rm -rf "$ANDROID_HOME/cmdline-tools/latest/*"
        mv temp_tools/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
        rm -rf cmdline-tools.zip temp_tools

        # የፈቃድ ስምምነቶችን ማረጋገጥ እና aidl (build-tools) መጫን
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
        yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true
        sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-33" "build-tools;33.0.0" "platform-tools"

    - name: Build APK with Buildozer
      env:
        REPO_OS_OVERRIDE: "linux"
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: ./bin/*.apk
