name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            ant

    - name: Install Python Packages
      run: |
        pip install --upgrade pip
        pip install --upgrade buildozer cython==0.29.36

    - name: Prepare Android SDK and Build-Tools (Fixes Aidl Error)
      run: |
        # 1. የመጀመሪያውን Buildozer ትዕዛዝ በማስኬድ SDK እንዲፈጠር ማድረግ
        buildozer -v android debug || true
        
        # 2. የ Android SDK እና cmdline-tools ትክክለኛ አድራሻ መፈለግ
        ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
        CMDLINE_TOOLS=$(find $ANDROID_HOME -name "sdkmanager" | head -n 1)
        
        if [ -n "$CMDLINE_TOOLS" ]; then
          echo "Found sdkmanager at: $CMDLINE_TOOLS"
          yes | "$CMDLINE_TOOLS" --licenses || true
          "$CMDLINE_TOOLS" "build-tools;33.0.0" "platforms;android-31"
        else
          echo "sdkmanager not found, but continuing..."
        fi

    - name: Final Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: ./bin/*.apk
